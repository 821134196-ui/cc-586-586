# 数据源：SQLite 本地文件
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/bookbox.db
quarkus.hibernate-orm.database.generation=update

quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M

# 业务配置
bookbox.data-dir=data
bookbox.covers-dir=data/covers
bookbox.loan-days=14
bookbox.seed.enabled=true

# 测试环境：独立库文件，每次重建
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-bookbox.db
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.bookbox.data-dir=target/test-data
%test.bookbox.covers-dir=target/test-data/covers
%test.bookbox.seed.enabled=false

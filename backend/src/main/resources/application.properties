# ---- 数据源：SQLite 本地文件 ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${bookbox.data-dir}/library.db
# SQLite 单写者：连接池限为 1，避免 SQLITE_BUSY
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.database.generation=update

# ---- 应用配置 ----
bookbox.data-dir=data
bookbox.loan-days=30
bookbox.seed.enabled=true

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# ---- 静态资源缓存（前端构建产物）----
quarkus.http.static-resources.cache-control.max-age=1H

# ---- 测试环境：独立数据库、不灌种子数据、关闭定时器 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/bookbox-test.db
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.bookbox.seed.enabled=false
%test.quarkus.scheduler.enabled=false
